# Configuration for 5-minute (5T) timeframe trading

paths:
  base: "/Users/omar/Desktop/ML_model/ML_model/feature_store"
  output: "./output/xauusd_5T_models/"
  
data:
  symbol: "XAUUSD"
  primary_timeframe: "5T"
  secondary_timeframes: ["15T", "1H"]  # Higher timeframes for regime context
  
labeling:
  method: "triple_barrier"
  take_profit_atr_multiples: [1.5, 2.0, 2.5]  # Tighter for 5T scalping
  stop_loss_atr_multiple: 1.0
  time_barrier_bars: 12  # 1 hour max holding = 12 x 5-min bars
  min_return_threshold: 0.00005  # 0.5 bps (5T is noisier)
  
features:
  lag_bars: 1  # Minimum lag
  correlation_threshold: 0.95
  missing_threshold: 0.05
  fractional_diff_order: 0.4
  
validation:
  method: "walk_forward"
  train_months: 3  # Shorter window for 5T (more data points)
  val_months: 1
  test_months: 1
  roll_forward_months: 1
  min_trades_per_fold: 100  # Higher trade frequency on 5T
  
models:
  train:
    - "lightgbm"
    - "xgboost"
    - "catboost"
  ensemble_top_k: 3
  
hyperparameter_tuning:
  method: "optuna"
  n_trials: 50  # Reduced for speed
  cv_folds: 3
  objective_weights:
    profit_factor: 0.4
    sharpe: 0.3
    drawdown: 0.3
  early_stopping_rounds: 50
  
performance_targets:
  profit_factor_min: 1.4  # Lower for 5T (more noise)
  win_rate_min: 0.50
  win_rate_max: 0.60
  max_drawdown_pct: 8.0  # Slightly higher tolerance for 5T
  sharpe_min: 0.20  # Lower for 5T
  r_multiple_min: 1.2
  min_trades_test: 200  # More trades expected on 5T
  
risk_management:
  position_sizing:
    method: "atr_scaled"
    risk_per_trade_pct: 0.5  # Lower risk per trade for scalping
    kelly_fraction_cap: 0.25
  execution_filters:
    min_confidence: 0.50  # Lower threshold for more trades
    max_spread_atr_ratio: 0.25  # Tighter spread filter for scalping
    max_volatility_zscore: 3.0
    blackout_sessions: ["asian"]  # Avoid low liquidity periods
  
deployment:
  export_onnx: true
  export_mlflow: false
  model_version: "v1.0_5T"
  
logging:
  level: "INFO"
  track_experiments: true
  save_intermediate: true

random_seed: 42