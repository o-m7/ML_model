name: Live Signal Generator

on:
  push:
    branches: [ main, master, claude/fix-trading-model-performance-01HMR2zbUJUWu8GAmRhbf3vK ]
  schedule:
    # Run continuously during market hours (Monday-Friday 00:00-22:00 UTC)
    - cron: '*/5 * * * 1-5'  # Every 5 minutes on weekdays

jobs:
  live-signals:
    runs-on: ubuntu-latest
    
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      POLYGON_S3_ACCESS_KEY: ${{ secrets.POLYGON_S3_ACCESS_KEY }}
      POLYGON_S3_SECRET_KEY: ${{ secrets.POLYGON_S3_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install websockets onnxruntime supabase
    
    - name: Convert models to ONNX
      run: |
        python model_converter.py
    
    - name: Run live signal generator (test mode)
      run: |
        timeout 60 python run_live_signals.py --test || true
    
    - name: Upload signals logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: signals-logs
        path: logs/
        retention-days: 7

  # Long-running signal generator (production)
  signal-stream:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install websockets onnxruntime supabase python-dotenv
    
    - name: Convert models to ONNX
      run: |
        python model_converter.py
    
    - name: Run live signals (max 6 hours)
      run: |
        timeout 21600 python run_live_signals.py || true
      continue-on-error: true
